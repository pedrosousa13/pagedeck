name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Its own `pnpm build`: the check spawns `dist/bin.js` and must not lean on `pnpm test`'s.
      - run: pnpm build && pnpm check:build-twice
      # The release runs it before publishing; here a break shows on the push, not the tag.
      - run: pnpm test:pack-harness
      # Its own sync and build, rather than whatever tree `site.build.test.ts` left behind.
      - name: Site parity against the declared baseline
        working-directory: packages/site
        run: |
          node ../core/dist/bin.js sync
          node ../core/dist/bin.js build
          node dist/parity.bin.js compare --build ./site --report parity-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: parity-report
          path: packages/site/parity-report.json
          retention-days: 90
