name: Deploy docs

# Publishes only with `apply: true`, and then fails unless both CLOUDFLARE_* secrets are
# set; see `docs/deploy-recipe.md`, "The docs site on Cloudflare".
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Publish. Off is a dry run that bundles the Worker and lists the upload, and sends nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A publishing run is never cancelled: wrangler uploads the assets before it publishes
# the version that serves them.
concurrency:
  group: deploy-docs-${{ inputs.apply && 'apply' || 'dry-run' }}
  cancel-in-progress: ${{ !inputs.apply }}

jobs:
  deploy:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      site: docs
      apply: ${{ inputs.apply }}
    # Read by the publish step alone.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
